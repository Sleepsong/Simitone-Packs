name: Build packs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simitone_ref:
        description: 'Simitone branch, tag or commit to build the packs against'
        required: false
        default: 'addon-packs'

env:
  # Code packs are compiled against Simitone, and only work with a build of Simitone from the same code.
  SIMITONE_REPOSITORY: Sleepsong/Simitone
  SIMITONE_REF: ${{ inputs.simitone_ref || 'addon-packs' }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build packs

    steps:
    - name: Checkout packs
      uses: actions/checkout@v4

    - name: Checkout Simitone
      uses: actions/checkout@v4
      with:
        repository: ${{ env.SIMITONE_REPOSITORY }}
        ref: ${{ env.SIMITONE_REF }}
        path: Simitone
        submodules: recursive

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Build Cheats
      run: dotnet build BuildCheats/BuildCheats.csproj -c Release

    - name: Build Half Walls
      run: dotnet build HalfWalls/HalfWalls.csproj -c Release

    - name: Build Terrain Paint
      run: dotnet build TerrainPaint/TerrainPaint.csproj -c Release

    - name: Build Roof Tool
      run: dotnet build RoofTool/RoofTool.csproj -c Release

    - name: Build Try for Baby
      run: dotnet build TryForBaby/TryForBaby.csproj -c Release

    - name: Build Foundations
      run: dotnet build Foundations/Foundations.csproj -c Release

    - name: Build Create a Style
      run: dotnet build CreateAStyle/CreateAStyle.csproj -c Release
    - name: Build Cut Content
      run: dotnet build CutContent/CutContent.csproj -c Release
    - name: Build Diagonal Doors, Stairs and Pools
      run: dotnet build DiagonalDoors/DiagonalDoors.csproj -c Release
    - name: Build Furnished or Unfurnished
      run: dotnet build FurnishedMoveIn/FurnishedMoveIn.csproj -c Release
    - name: Build Open for Business
      run: dotnet build OpenForBusiness/OpenForBusiness.csproj -c Release
    - name: Build Apartments
      run: dotnet build Apartments/Apartments.csproj -c Release
    - name: Test Apartments' patches and rules
      run: dotnet run --project Apartments/tests -c Release

    - name: Build Driveways
      run: dotnet build Driveways/Driveways.csproj -c Release

    - name: Test Driveways' route planning
      run: dotnet run --project Driveways/tests -c Release

    - name: Build Family Tree
      run: dotnet build FamilyTree/FamilyTree.csproj -c Release

    - name: Test Family Tree's patches and rules
      run: dotnet run --project FamilyTree/tests -c Release

    - name: Check the Driveways objects can be regenerated
      run: dotnet run --project Driveways/generator -c Release -- "$RUNNER_TEMP/driveways"

    - name: Build Life Stages
      run: dotnet build LifeStages/LifeStages.csproj -c Release

    - name: Test Life Stages' patches and rules
      run: dotnet run --project LifeStages/tests -c Release

    - name: Check the Test Cube object can be regenerated
      run: dotnet run --project TestCube/generator -c Release -- "$RUNNER_TEMP/testcube"

    # Each artifact unzips to the pack's folder, ready to drop into Simitone's Packs directory
    - name: Upload Build Cheats
      uses: actions/upload-artifact@v4
      with:
        name: BuildCheats
        path: BuildCheats/pack/
        if-no-files-found: error

    - name: Upload Half Walls
      uses: actions/upload-artifact@v4
      with:
        name: HalfWalls
        path: HalfWalls/pack/
        if-no-files-found: error

    - name: Upload Terrain Paint
      uses: actions/upload-artifact@v4
      with:
        name: TerrainPaint
        path: TerrainPaint/pack/
        if-no-files-found: error

    - name: Upload Roof Tool
      uses: actions/upload-artifact@v4
      with:
        name: RoofTool
        path: RoofTool/pack/
        if-no-files-found: error

    - name: Upload Try for Baby
      uses: actions/upload-artifact@v4
      with:
        name: TryForBaby
        path: TryForBaby/pack/
        if-no-files-found: error

    - name: Upload Foundations
      uses: actions/upload-artifact@v4
      with:
        name: Foundations
        path: Foundations/pack/
        if-no-files-found: error

    - name: Upload Create a Style
      uses: actions/upload-artifact@v4
      with:
        name: CreateAStyle
        path: CreateAStyle/pack/
    - name: Upload Cut Content
      uses: actions/upload-artifact@v4
      with:
        name: CutContent
        path: CutContent/pack/
    - name: Upload Diagonal Doors, Stairs and Pools
      uses: actions/upload-artifact@v4
      with:
        name: DiagonalDoors
        path: DiagonalDoors/pack/
    - name: Upload Furnished or Unfurnished
      uses: actions/upload-artifact@v4
      with:
        name: FurnishedMoveIn
        path: FurnishedMoveIn/pack/
    - name: Upload Open for Business
      uses: actions/upload-artifact@v4
      with:
        name: OpenForBusiness
        path: OpenForBusiness/pack/
        if-no-files-found: error

    - name: Upload Apartments
      uses: actions/upload-artifact@v4
      with:
        name: Apartments
        path: Apartments/pack/
        if-no-files-found: error

    - name: Upload Driveways
      uses: actions/upload-artifact@v4
      with:
        name: Driveways
        path: Driveways/pack/
        if-no-files-found: error

    - name: Upload Family Tree
      uses: actions/upload-artifact@v4
      with:
        name: FamilyTree
        path: FamilyTree/pack/
        if-no-files-found: error

    - name: Upload Life Stages
      uses: actions/upload-artifact@v4
      with:
        name: LifeStages
        path: LifeStages/pack/
        if-no-files-found: error

    - name: Upload Test Cube
      uses: actions/upload-artifact@v4
      with:
        name: TestCube
        path: TestCube/pack/
        if-no-files-found: error
